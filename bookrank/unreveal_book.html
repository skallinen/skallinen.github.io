<!DOCTYPE html>
<html>
<head><title>Unreveal Book</title>
<style>body{font-family:monospace;background:#111;color:#eee;padding:20px}button{padding:10px 20px;font-size:1rem;margin:8px;cursor:pointer}.done{color:#4caf50}.err{color:#f44336}input,select{padding:8px;font-size:1rem;width:400px;background:#222;color:#eee;border:1px solid #444}label{display:block;margin:12px 0 4px}small{color:#888}</style>
</head>
<body>
  <h2>Unreveal a Book</h2>
  <label>Club ID:</label>
  <input id="club-id" placeholder="paste club ID here" />
  <button onclick="loadBooks()">Load Books</button>

  <div id="book-section" style="display:none">
    <label>Select book to unreveal:</label>
    <select id="book-select"></select>
    <br>
    <label>
      <input type="checkbox" id="clear-discussed" />
      Also clear <code>discussed_at</code> (only if it was set by the reveal)
    </label>
    <br>
    <button onclick="unreveal()">Unreveal</button>
  </div>
  <div id="status"></div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script>
    firebase.initializeApp({
      apiKey: "AIzaSyCUn2U-L_gipdKcpcXe4r1TCM63dxhDVnM",
      authDomain: "book-club-e4916.firebaseapp.com",
      projectId: "book-club-e4916",
      storageBucket: "book-club-e4916.firebasestorage.app",
      messagingSenderId: "910679044088",
      appId: "1:910679044088:web:04f7c993a52c7f393af00d"
    });
    var db = firebase.firestore();
    var auth = firebase.auth();
    function log(msg,cls){document.getElementById('status').innerHTML+='<div class="'+(cls||'')+'">'+ msg+'</div>';}
    auth.onAuthStateChanged(function(u){if(u){log('Logged in: '+u.email);}else{auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());}});

    function loadBooks() {
      var clubId = document.getElementById('club-id').value.trim();
      if (!clubId) { log('Enter club ID','err'); return; }
      db.collection('clubs/' + clubId + '/books').get().then(function(snap) {
        var sel = document.getElementById('book-select');
        sel.innerHTML = '';
        snap.forEach(function(doc) {
          var d = doc.data();
          var opt = document.createElement('option');
          opt.value = doc.id;
          var revealed = d.revealed ? ' [REVEALED]' : '';
          opt.textContent = (d.title || doc.id) + revealed;
          if ((d.title || '').toLowerCase().indexOf('black bag') >= 0) opt.selected = true;
          sel.appendChild(opt);
        });
        document.getElementById('book-section').style.display = 'block';
        log('Books loaded. Select the book and click Unreveal.');
      }).catch(function(e){ log('Error: ' + e.message, 'err'); });
    }

    function unreveal() {
      var clubId = document.getElementById('club-id').value.trim();
      var bookId = document.getElementById('book-select').value;
      var clearDiscussed = document.getElementById('clear-discussed').checked;
      if (!clubId || !bookId) { log('Missing data','err'); return; }

      var updates = {
        revealed: false,
        revealed_at: firebase.firestore.FieldValue.delete()
      };
      if (clearDiscussed) {
        updates.discussed_at = firebase.firestore.FieldValue.delete();
      }

      log('Unrevealing...');
      db.collection('clubs/' + clubId + '/books').doc(bookId).update(updates)
        .then(function() {
          log('Done! Book is now unrevealed.', 'done');
        }).catch(function(e) {
          log('Error: ' + e.message, 'err');
        });
    }
  </script>
</body>
</html>
